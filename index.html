<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<title>Cámara ralentizada</title>
<style>
  :root {
    --bg: #000;
    --fg: #f5f5f7;
    --muted: #8e8e93;
    --panel: #1c1c1e;
    --accent: #0a84ff;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; overscroll-behavior: none; user-select: none; -webkit-user-select: none;
  }
  #app {
    display: flex; flex-direction: column; height: 100vh; height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  }

  /* ---------- Zona de imagen ---------- */
  #stage {
    position: relative; flex: 1 1 auto; min-height: 0; min-width: 0;
    background: #000; overflow: hidden;
    border: 2px solid transparent; border-radius: 0 0 var(--radius) var(--radius);
    transition: border-color .2s;
  }
  #stage.slow { border-color: var(--accent); }
  #preview { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  #modeBadge {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    padding: 6px 14px; border-radius: 999px; background: rgba(0,0,0,.6);
    font-weight: 700; font-size: 14px; letter-spacing: .5px; font-variant-numeric: tabular-nums;
    display: flex; align-items: center; gap: 8px;
  }
  #modeBadge .dot { width: 9px; height: 9px; border-radius: 50%; background: #30d158; }
  #stage.slow #modeBadge { background: rgba(10,132,255,.9); }
  #stage.slow #modeBadge .dot { background: #fff; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .25; } }

  #progress { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(255,255,255,.12); }
  #progressBar { height: 100%; width: 0; background: var(--accent); }

  #overlay {
    position: absolute; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; padding: 24px;
    text-align: center; background: rgba(0,0,0,.85);
  }
  #overlay.show { display: flex; }
  #overlayMsg { max-width: 420px; line-height: 1.45; font-size: 16px; }
  #overlayBtn {
    border: 0; border-radius: 999px; padding: 12px 26px; font-size: 16px; font-weight: 600;
    background: var(--fg); color: #000;
  }

  /* ---------- Controles ---------- */
  #controls {
    flex: 0 0 auto; display: flex; flex-direction: column; gap: 12px;
    padding: 12px 16px calc(14px + env(safe-area-inset-bottom));
  }
  #status { text-align: center; font-size: 14px; min-height: 1.2em; font-variant-numeric: tabular-nums; }

  .group { display: flex; flex-direction: column; gap: 6px; }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); padding-left: 2px; }
  .seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .seg.three { grid-template-columns: repeat(3, 1fr); }
  .seg button {
    min-height: 44px; border: 0; border-radius: 12px;
    background: var(--panel); color: var(--fg); font-size: 16px; font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .seg button[aria-pressed="true"] { background: var(--fg); color: #000; }

  .main-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin-top: 2px; }
  #flipBtn {
    justify-self: start; width: 54px; height: 54px; border-radius: 50%; border: 0;
    background: var(--panel); color: var(--fg); display: grid; place-items: center;
  }
  #flipBtn:disabled { opacity: .3; }
  #flipBtn svg { width: 26px; height: 26px; }

  /* Botón principal: ▶ para ralentizar, ■ para volver al directo */
  #slowBtn {
    width: 84px; height: 84px; border-radius: 50%; border: 0;
    background: var(--accent); color: #fff; display: grid; place-items: center; padding: 0;
  }
  #slowBtn svg { width: 36px; height: 36px; }
  #slowBtn .stop { display: none; }
  #slowBtn:active { transform: scale(.94); }
  #slowBtn:disabled { opacity: .35; }
  #liveBtn {
    justify-self: end; height: 54px; padding: 0 16px; border-radius: 999px; border: 0;
    background: var(--panel); color: var(--fg); font-size: 13px; font-weight: 700; letter-spacing: .5px;
  }
  #liveBtn:disabled { opacity: .3; }

  button { font-family: inherit; cursor: pointer; }

  /* Vídeo de cámara oculto (fuente de frames). No se usa display:none para que siga decodificando. */
  #cam { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; left: 0; top: 0; }

  /* ---------- Horizontal en pantallas bajas: controles a la derecha ---------- */
  @media (orientation: landscape) and (max-height: 600px) {
    #app { flex-direction: row; padding-bottom: env(safe-area-inset-bottom); }
    #stage { border-radius: 0 var(--radius) var(--radius) 0; }
    #controls { width: min(330px, 44vw); justify-content: center; overflow-y: auto; padding: 10px 14px; gap: 10px; }
    .seg button { min-height: 40px; font-size: 15px; }
    #slowBtn { width: 72px; height: 72px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="preview"></canvas>
    <div id="modeBadge"><span class="dot"></span><span id="modeText">EN DIRECTO</span></div>
    <div id="progress"><div id="progressBar"></div></div>
    <div id="overlay" class="show">
      <div id="overlayMsg">Solicitando acceso a la cámara…</div>
      <button id="overlayBtn" hidden>Reintentar</button>
    </div>
  </div>

  <div id="controls">
    <div id="status">Pulsa ▶ para ralentizar desde ahora</div>

    <div class="group">
      <span class="label">Velocidad</span>
      <div class="seg" id="speedSeg" role="group" aria-label="Velocidad"></div>
    </div>

    <div class="group">
      <span class="label">Volver al directo cuando el retraso llegue a</span>
      <div class="seg three" id="lagSeg" role="group" aria-label="Retraso máximo"></div>
    </div>

    <div class="main-row">
      <button id="flipBtn" aria-label="Cambiar cámara" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 7h-3.2l-1.6-2H8.8L7.2 7H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1z"/>
          <path d="M9 12.5a3 3 0 0 1 5.2-2"/><path d="M15 13.5a3 3 0 0 1-5.2 2"/>
          <path d="M14.5 8.8v1.9h-1.9"/><path d="M9.5 17.2v-1.9h1.9"/>
        </svg>
      </button>
      <button id="slowBtn" aria-label="Ralentizar desde ahora" disabled>
        <svg class="play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l10.5-6.5z"/></svg>
        <svg class="stop" viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="6.5" width="11" height="11" rx="2"/></svg>
      </button>
      <button id="liveBtn" aria-label="Volver al directo">DIRECTO</button>
    </div>
  </div>
</div>

<video id="cam" playsinline muted autoplay></video>

<script>
'use strict';

/* =====================================================================
   CÓMO FUNCIONA
   - Sin pulsar nada se ve la cámara en directo.
   - Al pulsar ▶ la imagen empieza a reproducirse más lenta desde ese
     mismo instante. Como va más lenta que la realidad, se va quedando
     un poco atrás (el retraso crece poco a poco).
   - Cuando el retraso llega al máximo elegido, salta al momento actual
     y sigue ralentizando desde ahí.
   - Cada pulsación de ▶ reinicia la cámara lenta desde ese instante.
   - El botón DIRECTO vuelve a la imagen en tiempo real.
   ===================================================================== */
const SPEEDS = [0.5, 0.65, 0.75, 0.85];  // velocidades suaves ("solo un poco" más lento)
const MAX_LAGS = [3, 5, 8];              // segundos de retraso antes de volver al directo
const STORAGE_KEY = 'camara-ralentizada-v2';

/* ---------- DOM ---------- */
const $ = (id) => document.getElementById(id);
const video = $('cam');
const canvas = $('preview');
const ctx = canvas.getContext('2d', { alpha: false });
const stage = $('stage');
const overlay = $('overlay');
const overlayMsg = $('overlayMsg');
const overlayBtn = $('overlayBtn');
const statusEl = $('status');
const modeText = $('modeText');
const progressBar = $('progressBar');
const slowBtn = $('slowBtn');
const liveBtn = $('liveBtn');
const flipBtn = $('flipBtn');

/* ---------- Estado ---------- */
const state = {
  speed: 0.75,
  maxLag: 5,
  facing: 'environment',
  mirrored: false,
  stream: null,
  canFlip: false,
  wakeLock: null
};
loadSettings();

/* =====================================================================
   BUFFER DE FRAMES { t, img, w, h }
   t = momento de captura (performance.now()); img = ImageBitmap o <canvas>.
   Solo se guardan frames mientras está activo el modo ralentizado.
   ===================================================================== */
const buffer = { frames: [], generation: 0, pending: 0, lastCapture: 0 };
let captureMode = (typeof window.createImageBitmap === 'function') ? 'bitmap' : 'canvas';
const canvasPool = [];

/* Modo ralentizado:
   start = momento real desde el que se reproduce
   c0    = momento (reloj) en que empezó esta tanda
   La posición reproducida es: start + (ahora − c0) × velocidad */
const slow = { active: false, start: 0, c0: 0, speedUsed: state.speed };

/** Resolución/fps de captura según el retraso máximo, para limitar la memoria. */
function captureConfig() {
  if (state.maxLag <= 3) return { fps: 30, longSide: 720 };
  if (state.maxLag <= 5) return { fps: 30, longSide: 600 };
  return { fps: 30, longSide: 480 };
}
function maxFrames() { return Math.ceil(state.maxLag * captureConfig().fps * 1.3) + 15; }

function scaledSize(vw, vh, longSide) {
  const scale = Math.min(1, longSide / Math.max(vw, vh));
  return { w: Math.max(2, Math.round(vw * scale)), h: Math.max(2, Math.round(vh * scale)) };
}

/** Libera un frame: cierra el ImageBitmap o devuelve el canvas a la reserva. */
function releaseFrame(f) {
  if (!f || !f.img) return;
  if (typeof f.img.close === 'function') f.img.close();
  else if (f.img instanceof HTMLCanvasElement && canvasPool.length < 64) canvasPool.push(f.img);
  f.img = null;
}

function clearBuffer() {
  buffer.frames.forEach(releaseFrame);
  buffer.frames = [];
  buffer.generation++;
  buffer.lastCapture = 0;
}

/** Elimina los frames que ya se han mostrado (anteriores a la posición de reproducción). */
function evictOldFrames(now) {
  const frames = buffer.frames;
  const playhead = currentPlayhead(now);
  // Se conserva el último frame anterior a la posición actual para poder dibujarlo.
  while (frames.length > 1 && frames[1].t <= playhead) releaseFrame(frames.shift());
  const limit = maxFrames();
  while (frames.length > limit) releaseFrame(frames.shift());
}

function pushFrame(frame) {
  const frames = buffer.frames;
  frames.push(frame);
  if (frames.length > 1 && frames[frames.length - 2].t > frame.t) frames.sort((a, b) => a.t - b.t);
  evictOldFrames(performance.now());
}

function getPoolCanvas(w, h) {
  const c = canvasPool.pop() || document.createElement('canvas');
  if (c.width !== w) c.width = w;
  if (c.height !== h) c.height = h;
  return c;
}

/** Captura un frame de la cámara (solo en modo ralentizado). */
function captureFrame(now) {
  if (!slow.active || !state.stream || video.readyState < 2 || !video.videoWidth) return;
  const { fps, longSide } = captureConfig();
  if (now - buffer.lastCapture < 1000 / fps - 4) return;
  buffer.lastCapture = now;
  const { w, h } = scaledSize(video.videoWidth, video.videoHeight, longSide);
  const gen = buffer.generation;

  if (captureMode === 'bitmap') {
    if (buffer.pending >= 3) return;
    buffer.pending++;
    let p;
    try {
      p = createImageBitmap(video, { resizeWidth: w, resizeHeight: h, resizeQuality: 'low' });
    } catch (e) { buffer.pending--; captureMode = 'canvas'; return; }
    p.then((img) => {
      buffer.pending--;
      if (gen !== buffer.generation) { img.close(); return; }
      pushFrame({ t: now, img, w, h });
    }).catch(() => { buffer.pending--; captureMode = 'canvas'; });
  } else {
    // Alternativa compatible sin createImageBitmap.
    const c = getPoolCanvas(w, h);
    c.getContext('2d').drawImage(video, 0, 0, w, h);
    pushFrame({ t: now, img: c, w, h });
  }
}

// Con requestVideoFrameCallback se captura justo cuando llega cada frame de la cámara.
const hasRVFC = 'requestVideoFrameCallback' in HTMLVideoElement.prototype;
function onVideoFrame() {
  captureFrame(performance.now());
  video.requestVideoFrameCallback(onVideoFrame);
}
if (hasRVFC) video.requestVideoFrameCallback(onVideoFrame);

/* =====================================================================
   REPRODUCCIÓN
   ===================================================================== */
function currentPlayhead(now) {
  return slow.start + (now - slow.c0) * state.speed;
}

/** Empieza (o reinicia) la reproducción lenta desde el instante actual. */
function restartSlowFromNow(now) {
  clearBuffer();
  slow.start = now;
  slow.c0 = now;
}

function startSlow() {
  if (!state.stream) return;
  slow.active = true;
  restartSlowFromNow(performance.now());
  stage.classList.add('slow');
  liveBtn.disabled = false;
  updateStatus(0);
  if (!state.wakeLock) requestWakeLock();
}

function stopSlow() {
  slow.active = false;
  clearBuffer();
  stage.classList.remove('slow');
  liveBtn.disabled = true;
  progressBar.style.width = '0%';
  releaseWakeLock();
  updateStatus(0);
}

// Cada pulsación (re)inicia la cámara lenta desde este mismo instante.
slowBtn.addEventListener('click', startSlow);
liveBtn.addEventListener('click', stopSlow);

/** Búsqueda binaria: último frame con t <= instante pedido. */
function findFrame(t) {
  const frames = buffer.frames;
  let lo = 0, hi = frames.length - 1, found = -1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (frames[mid].t <= t) { found = mid; lo = mid + 1; } else { hi = mid - 1; }
  }
  return found >= 0 ? frames[found] : frames[0];
}

/* ---------- Canvas ---------- */
let canvasW = 0, canvasH = 0;
function resizeCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const r = canvas.getBoundingClientRect();
  const w = Math.max(1, Math.round(r.width * dpr));
  const h = Math.max(1, Math.round(r.height * dpr));
  if (w !== canvasW || h !== canvasH) { canvas.width = canvasW = w; canvas.height = canvasH = h; }
}
if ('ResizeObserver' in window) new ResizeObserver(resizeCanvas).observe(canvas);
window.addEventListener('resize', resizeCanvas);

/** Dibuja una imagen ajustada a la pantalla sin deformarla. */
function drawImageFit(img, iw, ih) {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvasW, canvasH);
  if (!img || !iw || !ih) return;
  const scale = Math.min(canvasW / iw, canvasH / ih);
  const dw = iw * scale, dh = ih * scale;
  const dx = (canvasW - dw) / 2, dy = (canvasH - dh) / 2;
  ctx.save();
  if (state.mirrored) { ctx.translate(canvasW, 0); ctx.scale(-1, 1); }
  ctx.drawImage(img, state.mirrored ? canvasW - dx - dw : dx, dy, dw, dh);
  ctx.restore();
}

/* ---------- Bucle principal (requestAnimationFrame) ---------- */
let lastStatusUpdate = 0;
function loop(now) {
  if (!hasRVFC) captureFrame(now);
  if (!canvasW) resizeCanvas();

  if (!slow.active) {
    // Directo: se pinta la cámara tal cual.
    if (state.stream && video.readyState >= 2) drawImageFit(video, video.videoWidth, video.videoHeight);
  } else {
    let playhead = currentPlayhead(now);
    let lag = now - playhead;
    // Retraso máximo alcanzado: saltar al momento actual y seguir ralentizando.
    if (lag >= state.maxLag * 1000) {
      restartSlowFromNow(now);
      playhead = now; lag = 0;
    }
    if (buffer.frames.length) {
      const f = findFrame(playhead);
      drawImageFit(f.img, f.w, f.h);
    } else if (video.readyState >= 2) {
      drawImageFit(video, video.videoWidth, video.videoHeight); // aún no hay frames guardados
    }
    evictOldFrames(now);
    progressBar.style.width = Math.min(100, (lag / (state.maxLag * 1000)) * 100).toFixed(1) + '%';
    if (now - lastStatusUpdate > 100) { updateStatus(lag); lastStatusUpdate = now; }
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* =====================================================================
   CÁMARA (solo vídeo, sin micrófono)
   ===================================================================== */
function stopStream() {
  if (state.stream) state.stream.getTracks().forEach((t) => t.stop());
  state.stream = null;
  video.srcObject = null;
}

async function getStream(facing) {
  const base = { width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 60 } };
  const attempts = [
    { video: { ...base, facingMode: { exact: facing } }, audio: false },
    { video: { ...base, facingMode: { ideal: facing } }, audio: false },
    { video: true, audio: false }
  ];
  let lastError = null;
  for (const c of attempts) {
    try { return await navigator.mediaDevices.getUserMedia(c); }
    catch (err) { lastError = err; if (err && err.name === 'NotAllowedError') break; }
  }
  throw lastError;
}

async function openCamera(facing) {
  if (!window.isSecureContext) {
    return showError('La cámara solo funciona en una conexión segura (HTTPS).', false);
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    return showError('Este navegador no permite acceder a la cámara. Prueba con Chrome actualizado.', false);
  }
  const wasSlow = slow.active;
  if (wasSlow) stopSlow();
  showOverlay('Solicitando acceso a la cámara…');
  slowBtn.disabled = true;
  flipBtn.disabled = true;
  stopStream();

  try {
    const stream = await getStream(facing);
    state.stream = stream;
    const track = stream.getVideoTracks()[0];
    const s = (track && track.getSettings) ? track.getSettings() : {};
    state.facing = s.facingMode || facing;
    state.mirrored = state.facing === 'user';
    if (track) track.addEventListener('ended', () => {
      stopSlow();
      showError('Se ha perdido la conexión con la cámara.', true);
    });
    video.srcObject = stream;
    await video.play().catch(() => {});
    hideOverlay();
    slowBtn.disabled = false;
    await updateFlipAvailability();
    if (wasSlow) startSlow();
  } catch (err) {
    showError(cameraErrorMessage(err), true);
  }
}

function cameraErrorMessage(err) {
  switch (err && err.name) {
    case 'NotAllowedError':
    case 'SecurityError':
      return 'Permiso de cámara denegado. Toca el candado junto a la dirección web, permite la cámara y vuelve a intentarlo.';
    case 'NotFoundError':
    case 'OverconstrainedError':
      return 'No se ha encontrado ninguna cámara compatible en este dispositivo.';
    case 'NotReadableError':
    case 'AbortError':
      return 'La cámara está siendo usada por otra aplicación. Ciérrala y vuelve a intentarlo.';
    default:
      return 'No se ha podido abrir la cámara' + (err && err.message ? ': ' + err.message : '.');
  }
}

async function updateFlipAvailability() {
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    state.canFlip = devices.filter((d) => d.kind === 'videoinput').length > 1;
  } catch (e) { state.canFlip = false; }
  flipBtn.disabled = !state.canFlip;
}

flipBtn.addEventListener('click', () => {
  if (state.canFlip) openCamera(state.facing === 'user' ? 'environment' : 'user');
});

/* Pantalla siempre encendida mientras se ralentiza (si el navegador lo permite). */
async function requestWakeLock() {
  try { if ('wakeLock' in navigator) state.wakeLock = await navigator.wakeLock.request('screen'); }
  catch (e) { state.wakeLock = null; }
}
function releaseWakeLock() {
  try { if (state.wakeLock) state.wakeLock.release(); } catch (e) { /* sin importancia */ }
  state.wakeLock = null;
}

/* =====================================================================
   CONTROLES
   ===================================================================== */
function fmt(n) { return String(n).replace('.', ','); }

function buildSegment(container, values, current, label, onSelect) {
  values.forEach((v) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = label(v);
    b.setAttribute('aria-pressed', String(v === current));
    b.addEventListener('click', () => {
      container.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', 'false'));
      b.setAttribute('aria-pressed', 'true');
      onSelect(v);
    });
    container.appendChild(b);
  });
}

buildSegment($('speedSeg'), SPEEDS, state.speed, (v) => `${fmt(v)}x`, (v) => {
  // Mantener la posición actual para que el cambio de velocidad sea suave.
  if (slow.active) {
    const now = performance.now();
    const playhead = slow.start + (now - slow.c0) * slow.speedUsed;
    slow.c0 = now - (playhead - slow.start) / v;
  }
  state.speed = v;
  slow.speedUsed = v;
  saveSettings();
  updateStatus(slow.active ? performance.now() - currentPlayhead(performance.now()) : 0);
});

buildSegment($('lagSeg'), MAX_LAGS, state.maxLag, (v) => `${v} s`, (v) => {
  state.maxLag = v;
  saveSettings();
});

function updateStatus(lagMs) {
  if (slow.active) {
    modeText.textContent = `RALENTIZADO ${fmt(state.speed)}x`;
    statusEl.textContent = `Ralentizado a ${fmt(state.speed)}x · ${fmt((lagMs / 1000).toFixed(1))} s de retraso`;
  } else {
    modeText.textContent = 'EN DIRECTO';
    statusEl.textContent = 'Pulsa ▶ para ralentizar desde ahora';
  }
}

function loadSettings() {
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    if (SPEEDS.includes(s.speed)) state.speed = s.speed;
    if (MAX_LAGS.includes(s.maxLag)) state.maxLag = s.maxLag;
  } catch (e) { /* sin ajustes guardados */ }
}
function saveSettings() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ speed: state.speed, maxLag: state.maxLag })); }
  catch (e) { /* ignorar */ }
}

/* ---------- Mensajes ---------- */
function showOverlay(msg) { overlayMsg.textContent = msg; overlayBtn.hidden = true; overlay.classList.add('show'); }
function hideOverlay() { overlay.classList.remove('show'); }
function showError(msg, canRetry) {
  overlayMsg.textContent = msg;
  overlayBtn.hidden = !canRetry;
  overlay.classList.add('show');
  slowBtn.disabled = true;
}
overlayBtn.addEventListener('click', () => openCamera(state.facing));

// Al volver de segundo plano, los frames guardados ya no sirven: se reinicia desde ahora.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (state.stream && video.paused) video.play().catch(() => {});
  if (slow.active) { restartSlowFromNow(performance.now()); requestWakeLock(); }
});

/* ---------- Arranque ---------- */
slow.speedUsed = state.speed;
updateStatus(0);
