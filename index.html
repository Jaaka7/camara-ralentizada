<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<title>Cámara con previsualización ralentizada</title>
<style>
  :root {
    --bg: #000;
    --fg: #f5f5f7;
    --muted: #8e8e93;
    --panel: #1c1c1e;
    --panel-2: #2c2c2e;
    --rec: #ff3b30;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; overscroll-behavior: none; user-select: none; -webkit-user-select: none;
  }
  #app {
    display: flex; flex-direction: column; height: 100vh; height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  }

  /* ---------- Zona de previsualización ---------- */
  #stage {
    position: relative; flex: 1 1 auto; min-height: 0; min-width: 0;
    background: #000; overflow: hidden;
    border: 2px solid transparent; border-radius: 0 0 var(--radius) var(--radius);
    transition: border-color .2s;
  }
  #stage.recording { border-color: var(--rec); }
  #preview { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  #recBadge {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    display: none; align-items: center; gap: 8px;
    padding: 6px 14px; border-radius: 999px;
    background: rgba(255, 59, 48, .9); color: #fff;
    font-weight: 700; font-variant-numeric: tabular-nums; font-size: 15px; letter-spacing: .5px;
  }
  #stage.recording #recBadge { display: flex; }
  #recBadge .dot { width: 10px; height: 10px; border-radius: 50%; background: #fff; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .2; } }

  #delayTag {
    position: absolute; top: 12px; right: 12px;
    padding: 5px 10px; border-radius: 999px; background: rgba(0,0,0,.55);
    font-size: 12px; color: #fff; font-variant-numeric: tabular-nums;
  }
  #progress {
    position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,.12);
  }
  #progressBar { height: 100%; width: 0; background: rgba(255,255,255,.85); }

  #overlay {
    position: absolute; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; padding: 24px;
    text-align: center; background: rgba(0,0,0,.85);
  }
  #overlay.show { display: flex; }
  #overlayMsg { max-width: 420px; line-height: 1.45; font-size: 16px; }
  #overlayBtn {
    border: 0; border-radius: 999px; padding: 12px 26px; font-size: 16px; font-weight: 600;
    background: var(--fg); color: #000;
  }

  /* ---------- Controles ---------- */
  #controls {
    flex: 0 0 auto; display: flex; flex-direction: column; gap: 12px;
    padding: 12px 16px calc(14px + env(safe-area-inset-bottom));
  }
  #status { text-align: center; font-size: 14px; color: var(--fg); min-height: 1.2em; }
  #status small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }

  .group { display: flex; flex-direction: column; gap: 6px; }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); padding-left: 2px; }
  .seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .seg button {
    min-height: 44px; border: 0; border-radius: 12px;
    background: var(--panel); color: var(--fg); font-size: 16px; font-weight: 600;
    font-variant-numeric: tabular-nums; transition: background .15s, color .15s;
  }
  .seg button[aria-pressed="true"] { background: var(--fg); color: #000; }
  .seg button:active { transform: scale(.97); }

  .main-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin-top: 2px; }
  #flipBtn {
    justify-self: start; width: 54px; height: 54px; border-radius: 50%; border: 0;
    background: var(--panel); color: var(--fg); display: grid; place-items: center;
  }
  #flipBtn:disabled { opacity: .3; }
  #flipBtn svg { width: 26px; height: 26px; }

  #recBtn {
    width: 84px; height: 84px; border-radius: 50%; border: 5px solid var(--fg);
    background: transparent; padding: 0; display: grid; place-items: center;
  }
  #recBtn .inner {
    width: 62px; height: 62px; border-radius: 50%; background: var(--rec);
    transition: all .2s ease;
  }
  #recBtn.on .inner { width: 32px; height: 32px; border-radius: 8px; }
  #recBtn:disabled { opacity: .35; }
  #recHint { justify-self: end; font-size: 12px; color: var(--muted); text-align: right; max-width: 90px; }

  button { font-family: inherit; cursor: pointer; }
  button:disabled { cursor: not-allowed; }

  /* Vídeo de cámara oculto (fuente de frames). No se usa display:none para que siga decodificando. */
  #cam { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; left: 0; top: 0; }

  /* ---------- Horizontal en pantallas bajas: controles a la derecha ---------- */
  @media (orientation: landscape) and (max-height: 600px) {
    #app { flex-direction: row; padding-bottom: env(safe-area-inset-bottom); }
    #stage { border-radius: 0 var(--radius) var(--radius) 0; }
    #controls { width: min(330px, 44vw); justify-content: center; overflow-y: auto; padding: 10px 14px; gap: 10px; }
    .seg button { min-height: 40px; font-size: 15px; }
    #recBtn { width: 72px; height: 72px; }
    #recBtn .inner { width: 52px; height: 52px; }
    #recBtn.on .inner { width: 28px; height: 28px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="preview"></canvas>
    <div id="recBadge"><span class="dot"></span><span id="recTime">00:00</span></div>
    <div id="delayTag">−2 s · 0,35x</div>
    <div id="progress"><div id="progressBar"></div></div>
    <div id="overlay" class="show">
      <div id="overlayMsg">Solicitando acceso a la cámara…</div>
      <button id="overlayBtn" hidden>Reintentar</button>
    </div>
  </div>

  <div id="controls">
    <div id="status">Previsualización: hace 2 s a 0,35x</div>

    <div class="group">
      <span class="label">Retraso</span>
      <div class="seg" id="delaySeg" role="group" aria-label="Retraso de la previsualización"></div>
    </div>

    <div class="group">
      <span class="label">Velocidad</span>
      <div class="seg" id="speedSeg" role="group" aria-label="Velocidad de la previsualización"></div>
    </div>

    <div class="main-row">
      <button id="flipBtn" aria-label="Cambiar cámara" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 7h-3.2l-1.6-2H8.8L7.2 7H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1z"/>
          <path d="M9 12.5a3 3 0 0 1 5.2-2"/><path d="M15 13.5a3 3 0 0 1-5.2 2"/>
          <path d="M14.5 8.8v1.9h-1.9"/><path d="M9.5 17.2v-1.9h1.9"/>
        </svg>
      </button>
      <button id="recBtn" aria-label="Iniciar grabación" disabled><span class="inner"></span></button>
      <div id="recHint"></div>
    </div>
  </div>
</div>

<video id="cam" playsinline muted autoplay></video>

<script>
'use strict';

/* =====================================================================
   CONFIGURACIÓN
   ===================================================================== */
const DELAYS = [1, 2, 3, 5];             // segundos de retraso disponibles
const SPEEDS = [0.15, 0.25, 0.35, 0.5];  // velocidades de reproducción disponibles
const STORAGE_KEY = 'camara-ralentizada-ajustes';

// Tipos de archivo candidatos, en orden de preferencia (MP4 primero, luego WebM).
const MIME_CANDIDATES_AUDIO = [
  'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
  'video/mp4;codecs=avc1,mp4a',
  'video/mp4',
  'video/webm;codecs=vp9,opus',
  'video/webm;codecs=vp8,opus',
  'video/webm'
];
const MIME_CANDIDATES_VIDEO = [
  'video/mp4;codecs=avc1.42E01E',
  'video/mp4;codecs=avc1',
  'video/mp4',
  'video/webm;codecs=vp9',
  'video/webm;codecs=vp8',
  'video/webm'
];

/* =====================================================================
   REFERENCIAS AL DOM
   ===================================================================== */
const $ = (id) => document.getElementById(id);
const video = $('cam');
const canvas = $('preview');
const ctx = canvas.getContext('2d', { alpha: false });
const stage = $('stage');
const overlay = $('overlay');
const overlayMsg = $('overlayMsg');
const overlayBtn = $('overlayBtn');
const statusEl = $('status');
const delayTag = $('delayTag');
const progressBar = $('progressBar');
const recBtn = $('recBtn');
const recTime = $('recTime');
const recHint = $('recHint');
const flipBtn = $('flipBtn');

/* =====================================================================
   ESTADO DE LA APP
   ===================================================================== */
const state = {
  delay: 2,
  speed: 0.35,
  facing: 'environment',   // 'environment' = trasera, 'user' = frontal
  mirrored: false,         // la cámara frontal se muestra en espejo (solo en pantalla)
  stream: null,
  hasAudio: false,
  recorder: null,
  chunks: [],
  recording: false,
  recStart: 0,
  mime: '',
  wakeLock: null,
  canFlip: false
};

loadSettings();

/* =====================================================================
   BUFFER DE FRAMES
   Cada frame se guarda como { t, img, w, h }:
     t   -> marca de tiempo (performance.now()) del momento de captura
     img -> ImageBitmap (preferido) o <canvas> (alternativa compatible)
   Los frames se guardan reducidos de tamaño para limitar la memoria.
   ===================================================================== */
const buffer = {
  frames: [],
  generation: 0,   // se incrementa al vaciar el buffer: descarta capturas asíncronas antiguas
  pending: 0,      // capturas createImageBitmap en curso
  lastCapture: 0
};

// Modo de captura: 'bitmap' (createImageBitmap con redimensionado) o 'canvas' (alternativa).
let captureMode = (typeof window.createImageBitmap === 'function') ? 'bitmap' : 'canvas';

// Reserva de canvas reutilizables para el modo alternativo (evita crear/destruir constantemente).
const canvasPool = [];

/** Resolución y fps de captura según el retraso, para mantener la memoria acotada.
    El buffer necesita como máximo ~2 × retraso segundos de frames. */
function captureConfig() {
  const d = state.delay;
  if (d <= 1) return { fps: 30, longSide: 720 };
  if (d <= 2) return { fps: 30, longSide: 640 };
  if (d <= 3) return { fps: 24, longSide: 540 };
  return { fps: 20, longSide: 480 };
}

function maxFrames() {
  const { fps } = captureConfig();
  return Math.ceil(state.delay * 2 * fps * 1.25) + 10;
}

function scaledSize(vw, vh, longSide) {
  const scale = Math.min(1, longSide / Math.max(vw, vh));
  return { w: Math.max(2, Math.round(vw * scale)), h: Math.max(2, Math.round(vh * scale)) };
}

/** Libera la memoria de un frame: cierra el ImageBitmap o devuelve el canvas a la reserva. */
function releaseFrame(frame) {
  if (!frame || !frame.img) return;
  if (typeof frame.img.close === 'function') {
    frame.img.close();
  } else if (frame.img instanceof HTMLCanvasElement && canvasPool.length < 64) {
    canvasPool.push(frame.img);
  }
  frame.img = null;
}

function clearBuffer() {
  buffer.frames.forEach(releaseFrame);
  buffer.frames = [];
  buffer.generation++;
  buffer.lastCapture = 0;
  cycle.active = false;
}

/** Inserta un frame manteniendo el orden temporal y elimina los que ya no hacen falta. */
function pushFrame(frame) {
  const frames = buffer.frames;
  frames.push(frame);
  // Las capturas asíncronas casi siempre llegan en orden; si no, se reordena.
  if (frames.length > 1 && frames[frames.length - 2].t > frame.t) {
    frames.sort((a, b) => a.t - b.t);
  }
  evictOldFrames(frame.t);
}

/** Elimina frames que ya no se van a mostrar:
    - los anteriores al inicio del ciclo de reproducción actual, y
    - los anteriores a (ahora − retraso), que no hará falta para el siguiente ciclo. */
function evictOldFrames(now) {
  const frames = buffer.frames;
  const keepFromRolling = now - state.delay * 1000;
  const keepFromCycle = cycle.active ? cycle.start : Infinity;
  const cutoff = Math.min(keepFromRolling, keepFromCycle) - 60;
  while (frames.length && frames[0].t < cutoff) releaseFrame(frames.shift());
  // Tope de seguridad por número de frames.
  const limit = maxFrames();
  while (frames.length > limit) releaseFrame(frames.shift());
}

function getPoolCanvas(w, h) {
  const c = canvasPool.pop() || document.createElement('canvas');
  if (c.width !== w) c.width = w;
  if (c.height !== h) c.height = h;
  return c;
}

/** Captura un frame del vídeo de la cámara (si toca según los fps de captura). */
function captureFrame(now) {
  if (!state.stream || video.readyState < 2 || !video.videoWidth) return;
  const { fps, longSide } = captureConfig();
  if (now - buffer.lastCapture < 1000 / fps - 4) return;
  buffer.lastCapture = now;

  const { w, h } = scaledSize(video.videoWidth, video.videoHeight, longSide);
  const gen = buffer.generation;

  if (captureMode === 'bitmap') {
    if (buffer.pending >= 3) return; // el dispositivo va justo: se salta este frame
    buffer.pending++;
    let promise;
    try {
      promise = createImageBitmap(video, { resizeWidth: w, resizeHeight: h, resizeQuality: 'low' });
    } catch (e) {
      buffer.pending--;
      captureMode = 'canvas';
      return;
    }
    promise.then((img) => {
      buffer.pending--;
      // Si el buffer se vació mientras tanto (cambio de cámara/ajustes), se descarta.
      if (gen !== buffer.generation) { img.close(); return; }
      pushFrame({ t: now, img, w, h });
    }).catch(() => {
      buffer.pending--;
      captureMode = 'canvas'; // alternativa compatible si createImageBitmap falla
    });
  } else {
    // Alternativa sin createImageBitmap: copiar el frame a un canvas pequeño.
    const c = getPoolCanvas(w, h);
    c.getContext('2d').drawImage(video, 0, 0, w, h);
    pushFrame({ t: now, img: c, w, h });
  }
}

/* Si existe requestVideoFrameCallback se captura exactamente cuando llega un frame nuevo
   de la cámara; si no, la captura se hace dentro del bucle requestAnimationFrame. */
const hasRVFC = 'requestVideoFrameCallback' in HTMLVideoElement.prototype;
function onVideoFrame() {
  captureFrame(performance.now());
  video.requestVideoFrameCallback(onVideoFrame);
}
if (hasRVFC) video.requestVideoFrameCallback(onVideoFrame);

/* =====================================================================
   REPRODUCCIÓN RETRASADA Y RALENTIZADA
   La pantalla reproduce en bucle "ventanas" del pasado:
     1. Al empezar un ciclo se toma la ventana [t0 − retraso, t0],
        es decir, lo capturado durante los últimos X segundos.
     2. Esa ventana se reproduce a la velocidad elegida (p. ej. 0,35x),
        así que dura retraso / velocidad segundos en pantalla.
     3. Al terminar, se salta a la ventana más reciente y se repite.
   Así la imagen siempre corresponde a lo ocurrido hace unos segundos,
   ralentizada, sin que el retraso crezca indefinidamente.
   ===================================================================== */
const cycle = { active: false, start: 0, t0: 0, c0: 0 };

function startCycle(now) {
  const frames = buffer.frames;
  if (!frames.length) { cycle.active = false; return; }
  cycle.t0 = frames[frames.length - 1].t;
  cycle.start = Math.max(cycle.t0 - state.delay * 1000, frames[0].t);
  cycle.c0 = now;
  cycle.active = true;
}

/** Búsqueda binaria: último frame con marca de tiempo <= t. */
function findFrame(t) {
  const frames = buffer.frames;
  let lo = 0, hi = frames.length - 1, found = -1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (frames[mid].t <= t) { found = mid; lo = mid + 1; } else { hi = mid - 1; }
  }
  return found >= 0 ? frames[found] : frames[0];
}

/* ---------- Dibujo en el canvas ---------- */
let canvasW = 0, canvasH = 0;
function resizeCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const rect = canvas.getBoundingClientRect();
  const w = Math.max(1, Math.round(rect.width * dpr));
  const h = Math.max(1, Math.round(rect.height * dpr));
  if (w !== canvasW || h !== canvasH) {
    canvas.width = canvasW = w;
    canvas.height = canvasH = h;
  }
}
if ('ResizeObserver' in window) new ResizeObserver(resizeCanvas).observe(canvas);
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 200));

function drawFrame(frame, dim) {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvasW, canvasH);
  if (!frame || !frame.img) return;
  // Ajuste "contain": se ve el encuadre completo sin deformar.
  const scale = Math.min(canvasW / frame.w, canvasH / frame.h);
  const dw = frame.w * scale, dh = frame.h * scale;
  const dx = (canvasW - dw) / 2, dy = (canvasH - dh) / 2;
  ctx.save();
  if (state.mirrored) { ctx.translate(canvasW, 0); ctx.scale(-1, 1); }
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(frame.img, state.mirrored ? canvasW - dx - dw : dx, dy, dw, dh);
  ctx.restore();
  if (dim) { ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, canvasW, canvasH); }
}

function drawCenteredText(text) {
  const size = Math.round(Math.min(canvasW, canvasH) * 0.045) + 8;
  ctx.fillStyle = '#fff';
  ctx.font = `600 ${size}px system-ui, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, canvasW / 2, canvasH / 2);
}

/* ---------- Bucle principal con requestAnimationFrame ---------- */
function loop(now) {
  if (!hasRVFC) captureFrame(now);
  if (!canvasW) resizeCanvas();

  const frames = buffer.frames;
  const delayMs = state.delay * 1000;

  if (!frames.length) {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvasW, canvasH);
    progressBar.style.width = '0%';
  } else if (!cycle.active) {
    // Llenando el buffer: aún no hay X segundos grabados.
    const span = frames[frames.length - 1].t - frames[0].t;
    if (span >= delayMs - 80) {
      startCycle(now);
    } else {
      drawFrame(frames[frames.length - 1], true);
      drawCenteredText(`Preparando… ${fmt(Math.max(0, span / 1000).toFixed(1))} / ${fmt(state.delay)} s`);
      progressBar.style.width = '0%';
    }
  }

  if (cycle.active && frames.length) {
    let playhead = cycle.start + (now - cycle.c0) * state.speed;
    if (playhead >= cycle.t0) {
      startCycle(now);           // ventana terminada: saltar a la más reciente
      playhead = cycle.start;
    }
    drawFrame(findFrame(playhead), false);
    const len = Math.max(1, cycle.t0 - cycle.start);
    progressBar.style.width = (Math.min(1, (playhead - cycle.start) / len) * 100).toFixed(1) + '%';
  }

  if (state.recording) recTime.textContent = formatDuration(Date.now() - state.recStart);

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* =====================================================================
   CÁMARA
   ===================================================================== */
function stopStream() {
  if (state.stream) state.stream.getTracks().forEach((t) => t.stop());
  state.stream = null;
  video.srcObject = null;
}

/** Pide la cámara probando varias combinaciones, de la más exigente a la más compatible. */
async function getStream(facing) {
  const base = { width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 30 } };
  const attempts = [
    { video: { ...base, facingMode: { exact: facing } }, audio: true },
    { video: { ...base, facingMode: { ideal: facing } }, audio: true },
    { video: { ...base, facingMode: { ideal: facing } }, audio: false }, // por si el micrófono falla
    { video: true, audio: false }
  ];
  let lastError = null;
  for (const constraints of attempts) {
    try {
      return await navigator.mediaDevices.getUserMedia(constraints);
    } catch (err) {
      lastError = err;
      // Si el usuario ha denegado la cámara no tiene sentido seguir insistiendo con vídeo.
      if (err && err.name === 'NotAllowedError' && !constraints.audio) break;
    }
  }
  throw lastError;
}

async function openCamera(facing) {
  if (!window.isSecureContext) {
    return showError('La cámara solo funciona en una conexión segura (HTTPS). Abre la app desde una dirección https:// (por ejemplo GitHub Pages o Cloudflare Pages).', false);
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    return showError('Este navegador no permite acceder a la cámara. Prueba con Chrome actualizado.', false);
  }

  showOverlay('Solicitando acceso a la cámara…');
  recBtn.disabled = true;
  flipBtn.disabled = true;
  stopStream();
  clearBuffer();

  try {
    const stream = await getStream(facing);
    state.stream = stream;
    state.hasAudio = stream.getAudioTracks().length > 0;

    const vTrack = stream.getVideoTracks()[0];
    const settings = (vTrack && vTrack.getSettings) ? vTrack.getSettings() : {};
    state.facing = settings.facingMode || facing;
    state.mirrored = state.facing === 'user';

    // Si la cámara se desconecta, se para la grabación de forma segura.
    if (vTrack) vTrack.addEventListener('ended', () => {
      if (state.recording) stopRecording();
      showError('Se ha perdido la conexión con la cámara.', true);
    });

    video.srcObject = stream;
    await video.play().catch(() => {});
    hideOverlay();

    await updateFlipAvailability();
    recBtn.disabled = !checkRecorderSupport();
    updateStatus();
  } catch (err) {
    showError(cameraErrorMessage(err), true);
  }
}

function cameraErrorMessage(err) {
  const name = err && err.name;
  switch (name) {
    case 'NotAllowedError':
    case 'SecurityError':
      return 'Permiso de cámara denegado. Toca el candado junto a la dirección web, permite la cámara (y el micrófono) y vuelve a intentarlo.';
    case 'NotFoundError':
    case 'OverconstrainedError':
      return 'No se ha encontrado ninguna cámara compatible en este dispositivo.';
    case 'NotReadableError':
    case 'AbortError':
      return 'La cámara está siendo usada por otra aplicación. Ciérrala y vuelve a intentarlo.';
    default:
      return 'No se ha podido abrir la cámara' + (err && err.message ? ': ' + err.message : '.');
  }
}

/** Activa el botón de cambiar cámara solo si hay más de una. */
async function updateFlipAvailability() {
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    state.canFlip = devices.filter((d) => d.kind === 'videoinput').length > 1;
  } catch (e) {
    state.canFlip = false;
  }
  flipBtn.disabled = !state.canFlip || state.recording;
}

flipBtn.addEventListener('click', () => {
  if (state.recording || !state.canFlip) return;
  openCamera(state.facing === 'user' ? 'environment' : 'user');
});

/* =====================================================================
   GRABACIÓN (vídeo original a velocidad normal)
   El MediaRecorder graba directamente el stream de la cámara.
   La previsualización ralentizada NO afecta al archivo grabado.
   ===================================================================== */
function checkRecorderSupport() {
  if (typeof window.MediaRecorder === 'undefined') {
    recHint.textContent = 'Sin grabación';
    showToastError('Este navegador no permite grabar vídeo (MediaRecorder no disponible). Prueba con Chrome actualizado.');
    return false;
  }
  state.mime = pickMimeType(state.hasAudio);
  if (state.mime === null) {
    recHint.textContent = 'Sin formato';
    showToastError('Este navegador no admite ningún formato de vídeo compatible (MP4 o WebM).');
    return false;
  }
  recHint.textContent = (state.mime.includes('mp4') ? 'MP4' : (state.mime ? 'WebM' : 'Auto')) + (state.hasAudio ? '' : ' · sin audio');
  return true;
}

/** Devuelve el mejor tipo MIME soportado, '' si hay que dejar elegir al navegador, o null si nada sirve. */
function pickMimeType(withAudio) {
  if (typeof MediaRecorder.isTypeSupported !== 'function') return '';
  const list = withAudio ? MIME_CANDIDATES_AUDIO : MIME_CANDIDATES_VIDEO;
  for (const type of list) {
    try { if (MediaRecorder.isTypeSupported(type)) return type; } catch (e) { /* sigue probando */ }
  }
  return null;
}

function startRecording() {
  if (!state.stream || state.recording) return;
  let recorder;
  try {
    const options = { videoBitsPerSecond: 8000000 };
    if (state.mime) options.mimeType = state.mime;
    recorder = new MediaRecorder(state.stream, options);
  } catch (err) {
    try {
      recorder = new MediaRecorder(state.stream); // último recurso: formato por defecto
    } catch (err2) {
      showToastError('No se ha podido iniciar la grabación: ' + (err2.message || err2.name));
      return;
    }
  }

  state.chunks = [];
  recorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) state.chunks.push(e.data); };
  recorder.onstop = () => saveRecording(recorder);
  recorder.onerror = (e) => {
    showToastError('Error durante la grabación: ' + ((e.error && e.error.message) || 'desconocido'));
    if (state.recording) stopRecording();
  };

  try {
    recorder.start(1000); // fragmentos cada segundo para no perder datos
  } catch (err) {
    showToastError('No se ha podido iniciar la grabación: ' + (err.message || err.name));
    return;
  }

  state.recorder = recorder;
  state.recording = true;
  state.recStart = Date.now();
  recTime.textContent = '00:00';
  setRecordingUI(true);
  requestWakeLock();
}

function stopRecording() {
  if (!state.recording) return;
  state.recording = false;
  setRecordingUI(false);
  releaseWakeLock();
  try {
    if (state.recorder && state.recorder.state !== 'inactive') state.recorder.stop();
  } catch (e) {
    showToastError('Error al detener la grabación.');
  }
}

/** Une los fragmentos y descarga el vídeo automáticamente. */
function saveRecording(recorder) {
  const type = (recorder.mimeType || state.mime || 'video/webm').split(';')[0];
  const blob = new Blob(state.chunks, { type });
  state.chunks = [];
  state.recorder = null;
  if (!blob.size) {
    showToastError('La grabación está vacía. Inténtalo de nuevo grabando unos segundos más.');
    return;
  }
  const ext = type.includes('mp4') ? 'mp4' : 'webm';
  const d = new Date();
  const pad = (n) => String(n).padStart(2, '0');
  const name = `video_${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}_${pad(d.getHours())}-${pad(d.getMinutes())}-${pad(d.getSeconds())}.${ext}`;

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  a.remove();
  // Se libera la URL pasado un tiempo para que la descarga termine.
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

function setRecordingUI(on) {
  stage.classList.toggle('recording', on);
  recBtn.classList.toggle('on', on);
  recBtn.setAttribute('aria-label', on ? 'Detener grabación' : 'Iniciar grabación');
  flipBtn.disabled = on || !state.canFlip;
}

recBtn.addEventListener('click', () => {
  if (state.recording) stopRecording(); else startRecording();
});

/* Mantener la pantalla encendida mientras se graba (si el navegador lo permite). */
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) state.wakeLock = await navigator.wakeLock.request('screen');
  } catch (e) { state.wakeLock = null; }
}
function releaseWakeLock() {
  try { if (state.wakeLock) state.wakeLock.release(); } catch (e) { /* sin importancia */ }
  state.wakeLock = null;
}

/* =====================================================================
   CONTROLES DE RETRASO Y VELOCIDAD
   ===================================================================== */
function fmt(n) { return String(n).replace('.', ','); }

function buildSegment(container, values, current, label, onSelect) {
  container.innerHTML = '';
  values.forEach((v) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = label(v);
    b.setAttribute('aria-pressed', String(v === current));
    b.addEventListener('click', () => {
      container.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', 'false'));
      b.setAttribute('aria-pressed', 'true');
      onSelect(v);
    });
    container.appendChild(b);
  });
}

buildSegment($('delaySeg'), DELAYS, state.delay, (v) => `${v} s`, (v) => {
  state.delay = v;
  clearBuffer();      // nuevo retraso: se reinicia el buffer con la nueva resolución/fps
  onSettingsChanged();
});

buildSegment($('speedSeg'), SPEEDS, state.speed, (v) => `${fmt(v)}x`, (v) => {
  state.speed = v;
  // Se mantiene la posición actual de reproducción para que el cambio sea suave.
  if (cycle.active) {
    const now = performance.now();
    const playhead = cycle.start + (now - cycle.c0) * cycle.speedUsed;
    cycle.c0 = now - (playhead - cycle.start) / v;
  }
  onSettingsChanged();
});

function onSettingsChanged() {
  cycle.speedUsed = state.speed;
  updateStatus();
  saveSettings();
}

function updateStatus() {
  const audioNote = state.stream && !state.hasAudio ? '<small>Grabando sin audio (micrófono no disponible)</small>' : '';
  statusEl.innerHTML = `Previsualización: hace ${fmt(state.delay)} s a ${fmt(state.speed)}x${audioNote}`;
  delayTag.textContent = `−${fmt(state.delay)} s · ${fmt(state.speed)}x`;
}

function loadSettings() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    if (DELAYS.includes(saved.delay)) state.delay = saved.delay;
    if (SPEEDS.includes(saved.speed)) state.speed = saved.speed;
  } catch (e) { /* sin ajustes guardados */ }
}
function saveSettings() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ delay: state.delay, speed: state.speed })); } catch (e) { /* ignorar */ }
}

/* =====================================================================
   MENSAJES
   ===================================================================== */
function showOverlay(msg) {
  overlayMsg.textContent = msg;
  overlayBtn.hidden = true;
  overlay.classList.add('show');
}
function hideOverlay() { overlay.classList.remove('show'); }

function showError(msg, canRetry) {
  overlayMsg.textContent = msg;
  overlayBtn.hidden = !canRetry;
  overlay.classList.add('show');
  recBtn.disabled = true;
}

let toastTimer = null;
function showToastError(msg) {
  // Error no bloqueante: se muestra en la línea de estado durante unos segundos.
  statusEl.innerHTML = `<span style="color:var(--rec)">${msg.replace(/</g, '&lt;')}</span>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(updateStatus, 6000);
}

overlayBtn.addEventListener('click', () => openCamera(state.facing));

function formatDuration(ms) {
  const s = Math.floor(ms / 1000);
  const pad = (n) => String(n).padStart(2, '0');
  const h = Math.floor(s / 3600);
  return (h ? h + ':' : '') + pad(Math.floor((s % 3600) / 60)) + ':' + pad(s % 60);
}

/* Al volver a la app tras estar en segundo plano, los frames guardados están desfasados:
   se reinicia el buffer y se recupera el bloqueo de pantalla si se está grabando. */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    clearBuffer();
    if (state.recording) requestWakeLock();
    if (state.stream && video.paused) video.play().catch(() => {});
  }
});

// Si se cierra la página grabando, se intenta guardar lo grabado.
window.addEventListener('pagehide', () => { if (state.recording) stopRecording(); });

/* =====================================================================
   ARRANQUE
   ===================================================================== */
cycle.speedUsed = state.speed;
updateStatus();
resizeCanvas();
openCamera(state.facing);
</script>
</body>
</html>
