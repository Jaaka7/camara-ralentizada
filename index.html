<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<title>Cámara ralentizada</title>
<style>
  :root {
    --bg: #000;
    --fg: #f5f5f7;
    --muted: #8e8e93;
    --panel: #1c1c1e;
    --accent: #ff3b30;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; overscroll-behavior: none; user-select: none; -webkit-user-select: none;
  }
  #app {
    display: flex; flex-direction: column; height: 100vh; height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  }

  /* ---------- Zona de imagen ---------- */
  #stage {
    position: relative; flex: 1 1 auto; min-height: 0; min-width: 0;
    background: #000; overflow: hidden;
    border: 2px solid transparent; border-radius: 0 0 var(--radius) var(--radius);
    transition: border-color .2s;
  }
  #stage.slow { border-color: var(--accent); }
  #preview { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  #modeBadge {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    padding: 6px 14px; border-radius: 999px; background: rgba(0,0,0,.6);
    font-weight: 700; font-size: 14px; letter-spacing: .5px; font-variant-numeric: tabular-nums;
    display: flex; align-items: center; gap: 8px; white-space: nowrap;
  }
  #modeBadge .dot { width: 9px; height: 9px; border-radius: 50%; background: #30d158; }
  #stage.slow #modeBadge { background: rgba(255,59,48,.9); }
  #stage.slow #modeBadge .dot { background: #fff; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .25; } }

  #overlay {
    position: absolute; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; padding: 24px;
    text-align: center; background: rgba(0,0,0,.85);
  }
  #overlay.show { display: flex; }
  #overlayMsg { max-width: 420px; line-height: 1.45; font-size: 16px; }
  #overlayBtn {
    border: 0; border-radius: 999px; padding: 12px 26px; font-size: 16px; font-weight: 600;
    background: var(--fg); color: #000;
  }

  /* ---------- Controles ---------- */
  #controls {
    flex: 0 0 auto; display: flex; flex-direction: column; gap: 12px;
    padding: 12px 16px calc(14px + env(safe-area-inset-bottom));
  }
  #status { text-align: center; font-size: 14px; min-height: 1.2em; font-variant-numeric: tabular-nums; }

  .group { display: flex; flex-direction: column; gap: 6px; }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); padding-left: 2px; }
  .seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .seg button {
    min-height: 44px; border: 0; border-radius: 12px;
    background: var(--panel); color: var(--fg); font-size: 16px; font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .seg button[aria-pressed="true"] { background: var(--fg); color: #000; }

  .main-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin-top: 2px; }
  #flipBtn {
    justify-self: start; width: 54px; height: 54px; border-radius: 50%; border: 0;
    background: var(--panel); color: var(--fg); display: grid; place-items: center;
  }
  #flipBtn:disabled { opacity: .3; }
  #flipBtn svg { width: 26px; height: 26px; }

  /* Botón principal: cada pulsación reinicia la cámara lenta desde ese instante */
  #slowBtn {
    width: 84px; height: 84px; border-radius: 50%; border: 0;
    background: var(--accent); color: #fff; display: grid; place-items: center; padding: 0;
  }
  #slowBtn svg { width: 36px; height: 36px; }
  #slowBtn:active { transform: scale(.94); }
  #slowBtn:disabled { opacity: .35; }

  #liveBtn {
    justify-self: end; height: 54px; padding: 0 16px; border-radius: 999px; border: 0;
    background: var(--panel); color: var(--fg); font-size: 13px; font-weight: 700; letter-spacing: .5px;
  }
  #liveBtn:disabled { opacity: .3; }

  button { font-family: inherit; cursor: pointer; }

  /* Vídeo de cámara oculto (fuente de frames). No se usa display:none para que siga decodificando. */
  #cam { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; left: 0; top: 0; }

  /* ---------- Horizontal en pantallas bajas: controles a la derecha ---------- */
  @media (orientation: landscape) and (max-height: 600px) {
    #app { flex-direction: row; padding-bottom: env(safe-area-inset-bottom); }
    #stage { border-radius: 0 var(--radius) var(--radius) 0; }
    #controls { width: min(330px, 44vw); justify-content: center; overflow-y: auto; padding: 10px 14px; gap: 10px; }
    .seg button { min-height: 40px; font-size: 15px; }
    #slowBtn { width: 72px; height: 72px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="preview"></canvas>
    <div id="modeBadge"><span class="dot"></span><span id="modeText">EN DIRECTO</span></div>
    <div id="overlay" class="show">
      <div id="overlayMsg">Solicitando acceso a la cámara…</div>
      <button id="overlayBtn" hidden>Reintentar</button>
    </div>
  </div>

  <div id="controls">
    <div id="status">Pulsa ▶ para ralentizar desde ahora</div>

    <div class="group">
      <span class="label">Velocidad</span>
      <div class="seg" id="speedSeg" role="group" aria-label="Velocidad"></div>
    </div>

    <div class="main-row">
      <button id="flipBtn" aria-label="Cambiar cámara" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 7h-3.2l-1.6-2H8.8L7.2 7H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1z"/>
          <path d="M9 12.5a3 3 0 0 1 5.2-2"/><path d="M15 13.5a3 3 0 0 1-5.2 2"/>
          <path d="M14.5 8.8v1.9h-1.9"/><path d="M9.5 17.2v-1.9h1.9"/>
        </svg>
      </button>
      <button id="slowBtn" aria-label="Ralentizar desde ahora" disabled>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l10.5-6.5z"/></svg>
      </button>
      <button id="liveBtn" aria-label="Volver al directo" disabled>DIRECTO</button>
    </div>
  </div>
</div>

<video id="cam" playsinline muted autoplay></video>

<script>
'use strict';

/* =====================================================================
   CÓMO FUNCIONA
   - Al abrir se ve la cámara en directo.
   - Al pulsar ▶ la imagen empieza a reproducirse más lenta desde ese
     mismo instante (sin retraso inicial).
   - Solo se reinicia cuando vuelves a pulsar ▶. Nunca salta sola.
   - DIRECTO vuelve a la imagen en tiempo real.
   Los frames se guardan comprimidos en JPEG para poder ralentizar
   durante mucho tiempo sin agotar la memoria del móvil.
   ===================================================================== */
const SPEEDS = [0.5, 0.65, 0.75, 0.85];
const STORAGE_KEY = 'camara-ralentizada-v3';
const CAPTURE_FPS = 30;          // frames guardados por segundo
const CAPTURE_LONG_SIDE = 640;   // resolución de los frames guardados (lado largo)
const JPEG_QUALITY = 0.72;
const MAX_STORED_FRAMES = 6000;  // tope de seguridad (~3 min de retraso acumulado)
const DECODE_AHEAD = 3;          // frames que se decodifican por adelantado

/* ---------- DOM ---------- */
const $ = (id) => document.getElementById(id);
const video = $('cam');
const canvas = $('preview');
const ctx = canvas.getContext('2d', { alpha: false });
const stage = $('stage');
const overlay = $('overlay');
const overlayMsg = $('overlayMsg');
const overlayBtn = $('overlayBtn');
const statusEl = $('status');
const modeText = $('modeText');
const slowBtn = $('slowBtn');
const liveBtn = $('liveBtn');
const flipBtn = $('flipBtn');

/* ---------- Estado ---------- */
const state = { speed: 0.75, facing: 'environment', mirrored: false, stream: null, canFlip: false, wakeLock: null };
loadSettings();

/* =====================================================================
   BUFFER DE FRAMES
   Cada frame: { t, blob, img, decoding }
     t    -> momento de captura (performance.now())
     blob -> imagen JPEG comprimida (ocupa poco)
     img  -> versión decodificada lista para dibujar (solo los próximos frames)
   ===================================================================== */
const buffer = { frames: [], generation: 0, encoding: 0, lastCapture: 0 };
const scratch = document.createElement('canvas');
const scratchCtx = scratch.getContext('2d');

/* Modo lento: posición reproducida = start + (ahora − c0) × velocidad */
const slow = { active: false, start: 0, c0: 0 };
let shownFrame = null;   // último frame dibujado (se conserva para no parpadear)

function releaseImg(f) {
  if (f && f.img) { if (typeof f.img.close === 'function') f.img.close(); f.img = null; }
}
function clearBuffer() {
  buffer.frames.forEach(releaseImg);
  buffer.frames = [];
  buffer.generation++;
  buffer.lastCapture = 0;
  shownFrame = null;
}

/** Guarda un frame de la cámara comprimido en JPEG (solo en modo lento). */
function captureFrame(now) {
  if (!slow.active || !state.stream || video.readyState < 2 || !video.videoWidth) return;
  if (now - buffer.lastCapture < 1000 / CAPTURE_FPS - 4) return;
  if (buffer.encoding >= 4) return; // el móvil va justo: se salta este frame
  if (buffer.frames.length >= MAX_STORED_FRAMES) return;
  buffer.lastCapture = now;

  const scale = Math.min(1, CAPTURE_LONG_SIDE / Math.max(video.videoWidth, video.videoHeight));
  const w = Math.round(video.videoWidth * scale), h = Math.round(video.videoHeight * scale);
  if (scratch.width !== w) scratch.width = w;
  if (scratch.height !== h) scratch.height = h;
  scratchCtx.drawImage(video, 0, 0, w, h);

  const gen = buffer.generation;
  buffer.encoding++;
  scratch.toBlob((blob) => {
    buffer.encoding--;
    if (!blob || gen !== buffer.generation) return;
    const frames = buffer.frames;
    frames.push({ t: now, blob, img: null, decoding: false, w, h });
    if (frames.length > 1 && frames[frames.length - 2].t > now) frames.sort((a, b) => a.t - b.t);
  }, 'image/jpeg', JPEG_QUALITY);
}

const hasRVFC = 'requestVideoFrameCallback' in HTMLVideoElement.prototype;
function onVideoFrame() {
  captureFrame(performance.now());
  video.requestVideoFrameCallback(onVideoFrame);
}
if (hasRVFC) video.requestVideoFrameCallback(onVideoFrame);

/** Decodifica un JPEG a algo dibujable (ImageBitmap, o <img> si no hay createImageBitmap). */
function decodeBlob(blob) {
  if (typeof window.createImageBitmap === 'function') return createImageBitmap(blob);
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(blob);
    const im = new Image();
    im.onload = () => { URL.revokeObjectURL(url); resolve(im); };
    im.onerror = (e) => { URL.revokeObjectURL(url); reject(e); };
    im.src = url;
  });
}

function ensureDecoded(f) {
  if (!f || f.img || f.decoding) return;
  f.decoding = true;
  const gen = buffer.generation;
  decodeBlob(f.blob).then((img) => {
    f.decoding = false;
    if (gen !== buffer.generation || !f.blob) { if (img.close) img.close(); return; }
    f.img = img;
  }).catch(() => { f.decoding = false; });
}

/** Índice del último frame con t <= instante pedido (búsqueda binaria). */
function findIndex(t) {
  const frames = buffer.frames;
  let lo = 0, hi = frames.length - 1, found = -1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (frames[mid].t <= t) { found = mid; lo = mid + 1; } else { hi = mid - 1; }
  }
  return found;
}

/** Quita los frames ya mostrados para liberar memoria. */
function dropPlayedFrames(idx) {
  if (idx <= 0) return;
  const removed = buffer.frames.splice(0, idx);
  removed.forEach((f) => { if (f !== shownFrame) releaseImg(f); f.blob = null; });
}

/* =====================================================================
   CONTROLES DE MODO
   ===================================================================== */
function startSlow() {
  if (!state.stream) return;
  const now = performance.now();
  clearBuffer();
  slow.active = true;
  slow.start = now;   // empieza desde este mismo instante: sin retraso inicial
  slow.c0 = now;
  stage.classList.add('slow');
  liveBtn.disabled = false;
  updateStatus(0);
  if (!state.wakeLock) requestWakeLock();
}

function stopSlow() {
  slow.active = false;
  clearBuffer();
  stage.classList.remove('slow');
  liveBtn.disabled = true;
  releaseWakeLock();
  updateStatus(0);
}

slowBtn.addEventListener('click', startSlow);   // cada pulsación reinicia desde ahora
liveBtn.addEventListener('click', stopSlow);

/* =====================================================================
   DIBUJO
   ===================================================================== */
let canvasW = 0, canvasH = 0;
function resizeCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const r = canvas.getBoundingClientRect();
  const w = Math.max(1, Math.round(r.width * dpr));
  const h = Math.max(1, Math.round(r.height * dpr));
  if (w !== canvasW || h !== canvasH) { canvas.width = canvasW = w; canvas.height = canvasH = h; }
}
if ('ResizeObserver' in window) new ResizeObserver(resizeCanvas).observe(canvas);
window.addEventListener('resize', resizeCanvas);

function drawImageFit(img, iw, ih) {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvasW, canvasH);
  if (!img || !iw || !ih) return;
  const scale = Math.min(canvasW / iw, canvasH / ih);
  const dw = iw * scale, dh = ih * scale;
  const dx = (canvasW - dw) / 2, dy = (canvasH - dh) / 2;
  ctx.save();
  if (state.mirrored) { ctx.translate(canvasW, 0); ctx.scale(-1, 1); }
  ctx.drawImage(img, state.mirrored ? canvasW - dx - dw : dx, dy, dw, dh);
  ctx.restore();
}

/* ---------- Bucle principal (requestAnimationFrame) ---------- */
let lastStatusUpdate = 0;
function loop(now) {
  if (!hasRVFC) captureFrame(now);
  if (!canvasW) resizeCanvas();

  if (!slow.active) {
    if (state.stream && video.readyState >= 2) drawImageFit(video, video.videoWidth, video.videoHeight);
  } else {
    const playhead = slow.start + (now - slow.c0) * state.speed;
    const idx = findIndex(playhead);
    if (idx >= 0) {
      const frames = buffer.frames;
      // Decodificar el frame actual y los siguientes por adelantado.
      for (let i = idx; i < Math.min(frames.length, idx + 1 + DECODE_AHEAD); i++) ensureDecoded(frames[i]);
      const f = frames[idx];
      if (f.img && f !== shownFrame) {
        if (shownFrame && shownFrame !== f && !frames.includes(shownFrame)) releaseImg(shownFrame);
        shownFrame = f;
      }
      dropPlayedFrames(idx);
    }
    if (shownFrame && shownFrame.img) drawImageFit(shownFrame.img, shownFrame.w, shownFrame.h);

    if (now - lastStatusUpdate > 150) { updateStatus(now - playhead); lastStatusUpdate = now; }
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* =====================================================================
   CÁMARA (solo vídeo)
   ===================================================================== */
function stopStream() {
  if (state.stream) state.stream.getTracks().forEach((t) => t.stop());
  state.stream = null;
  video.srcObject = null;
}

async function getStream(facing) {
  const base = { width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 60 } };
  const attempts = [
    { video: { ...base, facingMode: { exact: facing } }, audio: false },
    { video: { ...base, facingMode: { ideal: facing } }, audio: false },
    { video: true, audio: false }
  ];
  let lastError = null;
  for (const c of attempts) {
    try { return await navigator.mediaDevices.getUserMedia(c); }
    catch (err) { lastError = err; if (err && err.name === 'NotAllowedError') break; }
  }
  throw lastError;
}

async function openCamera(facing) {
  if (!window.isSecureContext) return showError('La cámara solo funciona en una conexión segura (HTTPS).', false);
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    return showError('Este navegador no permite acceder a la cámara. Prueba con Chrome actualizado.', false);
  }
  stopSlow();
  showOverlay('Solicitando acceso a la cámara…');
  slowBtn.disabled = true;
  flipBtn.disabled = true;
  stopStream();
  try {
    const stream = await getStream(facing);
    state.stream = stream;
    const track = stream.getVideoTracks()[0];
    const s = (track && track.getSettings) ? track.getSettings() : {};
    state.facing = s.facingMode || facing;
    state.mirrored = state.facing === 'user';
    if (track) track.addEventListener('ended', () => {
      stopSlow();
      showError('Se ha perdido la conexión con la cámara.', true);
    });
    video.srcObject = stream;
    await video.play().catch(() => {});
    hideOverlay();
    slowBtn.disabled = false;
    await updateFlipAvailability();
  } catch (err) {
    showError(cameraErrorMessage(err), true);
  }
}

function cameraErrorMessage(err) {
  switch (err && err.name) {
    case 'NotAllowedError':
    case 'SecurityError':
      return 'Permiso de cámara denegado. Toca el candado junto a la dirección web, permite la cámara y vuelve a intentarlo.';
    case 'NotFoundError':
    case 'OverconstrainedError':
      return 'No se ha encontrado ninguna cámara compatible en este dispositivo.';
    case 'NotReadableError':
    case 'AbortError':
      return 'La cámara está siendo usada por otra aplicación. Ciérrala y vuelve a intentarlo.';
    default:
      return 'No se ha podido abrir la cámara' + (err && err.message ? ': ' + err.message : '.');
  }
}

async function updateFlipAvailability() {
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    state.canFlip = devices.filter((d) => d.kind === 'videoinput').length > 1;
  } catch (e) { state.canFlip = false; }
  flipBtn.disabled = !state.canFlip;
}
flipBtn.addEventListener('click', () => {
  if (state.canFlip) openCamera(state.facing === 'user' ? 'environment' : 'user');
});

async function requestWakeLock() {
  try { if ('wakeLock' in navigator) state.wakeLock = await navigator.wakeLock.request('screen'); }
  catch (e) { state.wakeLock = null; }
}
function releaseWakeLock() {
  try { if (state.wakeLock) state.wakeLock.release(); } catch (e) { /* sin importancia */ }
  state.wakeLock = null;
}

/* =====================================================================
   VELOCIDAD Y ESTADO
   ===================================================================== */
function fmt(n) { return String(n).replace('.', ','); }

const speedSeg = $('speedSeg');
SPEEDS.forEach((v) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = `${fmt(v)}x`;
  b.setAttribute('aria-pressed', String(v === state.speed));
  b.addEventListener('click', () => {
    speedSeg.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', 'false'));
    b.setAttribute('aria-pressed', 'true');
    // Mantener la posición actual para que el cambio de velocidad sea suave.
    if (slow.active) {
      const now = performance.now();
      const playhead = slow.start + (now - slow.c0) * state.speed;
      slow.c0 = now - (playhead - slow.start) / v;
    }
    state.speed = v;
    saveSettings();
    updateStatus(0);
  });
  speedSeg.appendChild(b);
});

function updateStatus(lagMs) {
  if (slow.active) {
    modeText.textContent = `RALENTIZADO ${fmt(state.speed)}x`;
    const full = buffer.frames.length >= MAX_STORED_FRAMES ? ' · memoria llena, pulsa ▶' : '';
    statusEl.textContent = `Ralentizado a ${fmt(state.speed)}x · ${fmt((lagMs / 1000).toFixed(1))} s por detrás${full}`;
  } else {
    modeText.textContent = 'EN DIRECTO';
    statusEl.textContent = 'Pulsa ▶ para ralentizar desde ahora';
  }
}

function loadSettings() {
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    if (SPEEDS.includes(s.speed)) state.speed = s.speed;
  } catch (e) { /* sin ajustes guardados */ }
}
function saveSettings() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ speed: state.speed })); } catch (e) { /* ignorar */ }
}

/* ---------- Mensajes ---------- */
function showOverlay(msg) { overlayMsg.textContent = msg; overlayBtn.hidden = true; overlay.classList.add('show'); }
function hideOverlay() { overlay.classList.remove('show'); }
function showError(msg, canRetry) {
  overlayMsg.textContent = msg;
  overlayBtn.hidden = !canRetry;
  overlay.classList.add('show');
  slowBtn.disabled = true;
}
overlayBtn.addEventListener('click', () => openCamera(state.facing));

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (state.stream && video.paused) video.play().catch(() => {});
  if (slow.active) requestWakeLock();
});

/* ---------- Arranque ---------- */
updateStatus(0);
resizeCanvas();
openCamera(state.facing);
</script>
</body>
</html>
